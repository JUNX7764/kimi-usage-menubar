<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KimiUsage 迭代原型 v0.6</title><style>
:root {color-scheme:light dark}
body {margin:0;background:light-dark(#f3f4f6,#18181a)}
.viz-dotted-background {background-image:radial-gradient(light-dark(#d7d9de,#38383c) 1px,transparent 1px);background-size:16px 16px}
button,label,input {cursor:pointer}
button:focus-visible {outline:2px solid light-dark(#204b80,#85b5ed);outline-offset:3px}
</style></head><body><div id="kimi-iteration-prototype" aria-label="KimiUsage 迭代交互原型 v0.6">
  <div class="kp-stage viz-dotted-background">
    <div class="kp-shell" aria-label="KimiUsage 菜单栏面板">
      <div class="kp-menubar"><span>示例数据 · 评审原型 v0.6</span><span class="kp-status">K <span data-status-quota>5H 77% · 7D 33% · 月 58%</span></span></div>
      <div class="kp-popover">
        <header class="kp-header"><div class="kp-brand">K</div><div class="kp-title"><div class="kp-title-row"><strong>Kimi 用量</strong><span class="kp-plan">Allegretto</span></div><div class="kp-email">user@example.com</div></div></header>
        <section class="kp-section kp-quota" aria-label="额度（冻结区，镜像 v1.4.10 现状）">
          <div class="kp-quota-head">重置时间</div>
          <div data-quota-content></div>
        </section>
        <section class="kp-section" aria-label="用量情况">
          <div class="kp-section-head"><h3><span class="kp-sec-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="9.5" height="9.5" rx="2" opacity=".4"/><rect x="3.2" y="3.2" width="9.5" height="9.5" rx="2" opacity=".7"/><rect x="5.5" y="5.5" width="9.5" height="9.5" rx="2"/></svg></span>用量情况</h3><button class="kp-collapse cursor-interaction" data-action="usage" aria-expanded="true" aria-label="折叠用量情况"><span aria-hidden="true">⌄</span></button></div>
          <div data-usage-content>
            <div class="kp-tablehead"><span>周期</span><span>总量</span><span>输入</span><span>输出</span></div>
            <div data-period-table></div>
          </div>
        </section>
        <section class="kp-section" aria-label="用量简析">
          <div class="kp-section-head"><h3><span class="kp-sec-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="6.5" width="3.6" height="8" rx="1"/><rect x="6.2" y="1.5" width="3.6" height="13" rx="1"/><rect x="10.9" y="9" width="3.6" height="5.5" rx="1"/></svg></span>用量简析</h3><button class="kp-collapse cursor-interaction" data-action="brief" aria-expanded="true" aria-label="折叠用量简析"><span aria-hidden="true">⌄</span></button></div>
          <div data-brief-content>
            <div class="kp-chart-wrap">
              <div class="kp-chart" data-chart role="group" aria-label="近 30 天每日总 Token 柱状图"></div>
              <div class="kp-overlay" data-overlay hidden aria-live="polite"></div>
            </div>
            <div class="kp-axis"><span data-chart-first>10/08</span><span>每日柱状图 · 近 30 天</span><span data-chart-last>11/06</span></div>
            <div class="kp-compare-card"><div class="kp-compare-item"><span>较昨日</span><strong data-compare-day>+12.4%</strong></div><div class="kp-compare-div" aria-hidden="true"></div><div class="kp-compare-item"><span>较前 7 天</span><strong data-compare-week>−6.2%</strong></div></div>
          </div>
        </section>
        <section class="kp-section" aria-label="工具明细">
          <div class="kp-tools-head">
            <h3><span class="kp-sec-icon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="2.8" cy="3.6" r="1.5"/><circle cx="2.8" cy="8" r="1.5"/><circle cx="2.8" cy="12.4" r="1.5"/><rect x="5.8" y="2.7" width="9" height="1.8" rx=".9"/><rect x="5.8" y="7.1" width="9" height="1.8" rx=".9"/><rect x="5.8" y="11.5" width="9" height="1.8" rx=".9"/></svg></span>工具明细</h3>
            <div class="kp-blue-segment" role="group" aria-label="工具明细周期"><button class="cursor-interaction" data-tool-range="1" aria-pressed="false">今日</button><button class="cursor-interaction" data-tool-range="7" aria-pressed="true">7 天</button><button class="cursor-interaction" data-tool-range="30" aria-pressed="false">30 天</button></div>
            <button class="kp-collapse cursor-interaction" data-action="tools" aria-expanded="false" aria-label="展开工具明细"><span aria-hidden="true">⌄</span></button>
          </div>
          <div data-tool-detail hidden></div>
        </section>
        <footer class="kp-footer">
          <div class="kp-meta"><span data-last-scan>最近尝试刷新 21:10</span><button class="kp-version cursor-interaction" data-action="update" aria-label="检查 KimiUsage 更新">版本 v1.4.10</button></div>
          <div class="kp-update" data-update hidden aria-live="polite"></div>
          <div class="kp-actions"><button class="kp-refresh cursor-interaction" data-action="refresh">立即刷新</button><label class="cursor-interaction"><input type="checkbox" data-autostart checked>开机自启</label><span class="kp-flex"></span><button class="kp-quit cursor-interaction" data-action="quit">退出</button></div>
        </footer>
      </div>
    </div>
  </div>
</div>
<style>
#kimi-iteration-prototype { --kp-bg:light-dark(#fbfbfc,#242426); --kp-raised:light-dark(#ffffff,#303033); --kp-ink:light-dark(#222326,#f0f0f2); --kp-muted:light-dark(#62646c,#b0b1b8); --kp-line:light-dark(#e5e5e9,#3d3d41); --kp-track:light-dark(#e8e9ec,#424247); --kp-accent:light-dark(#204b80,#85b5ed); --kp-accent-soft:light-dark(#e4ebf5,#1f2e47); --kp-green:light-dark(#1a7f4b,#6fcf97); --kp-warn:light-dark(#996016,#edbd76); --kp-soft:light-dark(#f0f1f3,#363638); --kp-shadow:light-dark(#00000018,#00000040); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--kp-ink); font-size:12px; line-height:1.45; }
#kimi-iteration-prototype * { box-sizing:border-box; }
#kimi-iteration-prototype [hidden] { display:none !important; }
#kimi-iteration-prototype button,#kimi-iteration-prototype input { font:inherit; color:inherit; }
#kimi-iteration-prototype button { border:0; background:none; }
#kimi-iteration-prototype .kp-stage { padding:20px 6px 24px; display:flex; justify-content:center; }

#kimi-iteration-prototype .kp-menubar { display:flex; align-items:center; justify-content:space-between; gap:7px; flex-wrap:wrap; padding:0 4px 14px; color:var(--kp-muted); font-size:11px; }
#kimi-iteration-prototype .kp-status { padding:4px 6px; border-radius:5px; background:var(--kp-raised); color:var(--kp-ink); box-shadow:0 1px 5px var(--kp-shadow); font-size:11px; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-popover { background:var(--kp-bg); border:1px solid var(--kp-line); border-radius:14px; box-shadow:0 10px 28px var(--kp-shadow); overflow:clip; }
#kimi-iteration-prototype .kp-header { display:flex; align-items:center; gap:8px; padding:16px 16px 12px; border-bottom:1px solid var(--kp-line); }
#kimi-iteration-prototype .kp-brand { display:grid; place-items:center; width:27px; height:27px; background:var(--kp-ink); color:var(--kp-bg); border-radius:7px; font-size:19px; font-weight:500; }
#kimi-iteration-prototype .kp-title { display:flex; flex:1; flex-direction:column; align-items:flex-start; gap:2px; }
#kimi-iteration-prototype .kp-title-row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
#kimi-iteration-prototype .kp-title strong { font-size:14px; font-weight:500; }

#kimi-iteration-prototype .kp-quota { border-top:0; padding-top:12px; }
#kimi-iteration-prototype .kp-quota-head { text-align:right; color:var(--kp-muted); font-size:10px; margin-bottom:2px; }
#kimi-iteration-prototype .kp-quota-row { display:grid; grid-template-columns:47px 44px 1fr auto; gap:6px; align-items:center; padding:3px 0; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-quota-row .kp-q-title { font-weight:600; font-size:12px; }
#kimi-iteration-prototype .kp-quota-row .kp-q-pct { font-weight:600; font-size:14px; }

#kimi-iteration-prototype .kp-fill-warn { background:var(--kp-warn); opacity:1; }
#kimi-iteration-prototype .kp-section-head,#kimi-iteration-prototype .kp-tools-head { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
#kimi-iteration-prototype h3 { display:flex; flex:1; align-items:center; gap:6px; font-size:12px; font-weight:500; margin:0; }
#kimi-iteration-prototype .kp-sec-icon { display:inline-flex; width:13px; height:13px; color:var(--kp-accent); }
#kimi-iteration-prototype .kp-sec-icon svg { width:13px; height:13px; }
#kimi-iteration-prototype .kp-muted { color:var(--kp-muted); font-size:11px; }
#kimi-iteration-prototype .kp-collapse { color:var(--kp-muted); padding:0 2px; font-size:12px; line-height:1; }
#kimi-iteration-prototype .kp-collapse span { display:inline-block; transition:transform .12s; }
#kimi-iteration-prototype .kp-collapse[aria-expanded="false"] span { transform:rotate(-90deg); }
#kimi-iteration-prototype .kp-tablehead,#kimi-iteration-prototype .kp-period,#kimi-iteration-prototype .kp-model { display:grid; grid-template-columns:minmax(61px,1.1fr) repeat(3,minmax(0,1fr)); gap:4px; align-items:center; }
#kimi-iteration-prototype .kp-tablehead { font-size:11px; color:var(--kp-muted); padding:0 0 4px; }
#kimi-iteration-prototype .kp-tablehead span:not(:first-child),#kimi-iteration-prototype .kp-period span:not(:first-child),#kimi-iteration-prototype .kp-model span:not(:first-child) { text-align:right; }
#kimi-iteration-prototype .kp-period { width:100%; padding:8px 0; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-period:hover { background:var(--kp-soft); }
#kimi-iteration-prototype .kp-period span:first-child { display:flex; gap:2px; align-items:center; text-align:left; }
#kimi-iteration-prototype .kp-period span:first-child .kp-chev { display:inline-block; transition:transform .12s; }
#kimi-iteration-prototype .kp-period[aria-expanded="true"] span:first-child .kp-chev { transform:rotate(90deg); }
#kimi-iteration-prototype .kp-models { background:var(--kp-soft); border-radius:6px; padding:5px 8px; }
#kimi-iteration-prototype .kp-model { padding:5px 0; font-size:11px; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-chart-wrap { position:relative; }
#kimi-iteration-prototype .kp-chart { display:flex; align-items:stretch; height:50px; }
#kimi-iteration-prototype .kp-bar { flex:1; min-width:0; display:flex; align-items:flex-end; padding:0 1px; }
#kimi-iteration-prototype .kp-bar span { display:block; width:100%; min-height:2px; background:var(--kp-accent); opacity:.5; border-radius:2px 2px 0 0; }
#kimi-iteration-prototype .kp-bar.kp-today span { opacity:.85; box-shadow:inset 0 0 0 1px var(--kp-accent); }
#kimi-iteration-prototype .kp-bar.kp-missing span { height:100%; background:var(--kp-soft); opacity:1; border-radius:2px; }
#kimi-iteration-prototype .kp-bar:hover span,#kimi-iteration-prototype .kp-bar:focus-visible span { opacity:1; }
#kimi-iteration-prototype .kp-overlay { position:absolute; top:-4px; transform:translateY(-100%); background:var(--kp-raised); border:1px solid var(--kp-line); border-radius:6px; box-shadow:0 2px 8px var(--kp-shadow); padding:4px 7px; font-size:11px; font-variant-numeric:tabular-nums; pointer-events:none; white-space:nowrap; z-index:2; }
#kimi-iteration-prototype .kp-overlay small { display:block; color:var(--kp-muted); font-size:11px; }
#kimi-iteration-prototype .kp-axis { display:flex; justify-content:space-between; margin-top:4px; color:var(--kp-muted); font-size:11px; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-compare-card { display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px 12px; background:var(--kp-soft); border-radius:8px; font-size:11px; }
#kimi-iteration-prototype .kp-compare-item { display:flex; gap:6px; flex:1; }
#kimi-iteration-prototype .kp-compare-item span { color:var(--kp-muted); }
#kimi-iteration-prototype .kp-compare-item strong { font-weight:500; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-compare-item strong.kp-up { color:var(--kp-accent); }
#kimi-iteration-prototype .kp-compare-item strong.kp-down { color:var(--kp-green); }
#kimi-iteration-prototype .kp-compare-div { width:1px; align-self:stretch; background:var(--kp-line); }
#kimi-iteration-prototype .kp-blue-segment { display:flex; gap:2px; background:var(--kp-accent-soft); padding:2px; border-radius:6px; }
#kimi-iteration-prototype .kp-blue-segment button { padding:1px 7px; font-size:11px; border-radius:4px; color:var(--kp-accent); }
#kimi-iteration-prototype .kp-blue-segment button[aria-pressed="true"] { background:var(--kp-accent); color:light-dark(#fff,#0f1c30); }
#kimi-iteration-prototype .kp-tool { display:grid; grid-template-columns:minmax(0,1fr) minmax(96px,120px) 54px; align-items:center; gap:8px; padding:6px 0; font-size:11px; border-bottom:1px solid var(--kp-line); }
#kimi-iteration-prototype .kp-tool:last-child { border-bottom:0; }
#kimi-iteration-prototype .kp-tool-name { font-weight:500; }
#kimi-iteration-prototype .kp-tool-name small { display:block; color:var(--kp-muted); font-weight:400; }
#kimi-iteration-prototype .kp-share { display:grid; grid-template-columns:1fr 30px; gap:6px; align-items:center; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-share .kp-track { height:3px; }
#kimi-iteration-prototype .kp-share .kp-fill { background:var(--kp-accent); opacity:.8; }
#kimi-iteration-prototype .kp-share .kp-muted { text-align:right; }
#kimi-iteration-prototype .kp-tool-total { text-align:right; font-variant-numeric:tabular-nums; }
#kimi-iteration-prototype .kp-footer { display:flex; flex-direction:column; gap:8px; padding:10px 16px 12px; border-top:1px solid var(--kp-line); color:var(--kp-muted); font-size:11px; }
#kimi-iteration-prototype .kp-meta { display:flex; align-items:center; justify-content:space-between; gap:6px; }
#kimi-iteration-prototype .kp-version { padding:0; font-size:11px; color:var(--kp-muted); }
#kimi-iteration-prototype .kp-actions { display:flex; align-items:center; gap:9px; }
#kimi-iteration-prototype .kp-flex { flex:1; }
#kimi-iteration-prototype .kp-refresh { background:var(--kp-accent); color:light-dark(#fff,#0f1c30); padding:5px 16px; border-radius:7px; font-size:12px; font-weight:500; }
#kimi-iteration-prototype .kp-actions label { display:flex; align-items:center; gap:4px; }
#kimi-iteration-prototype .kp-actions input { width:13px; height:13px; margin:0; accent-color:var(--kp-accent); }
#kimi-iteration-prototype .kp-quit { color:var(--kp-muted); }
#kimi-iteration-prototype .kp-update { font-size:11px; color:var(--kp-muted); }
@media(max-width:370px) { #kimi-iteration-prototype .kp-section,#kimi-iteration-prototype .kp-header { padding-left:12px; padding-right:12px; } }
</style>
<script>
(() => {
  const root = document.getElementById('kimi-iteration-prototype');
  const q = selector => root.querySelector(selector);
  const qa = selector => Array.from(root.querySelectorAll(selector));
  const design = { scenario:'正常', width:330 };
  const ui = { usage:true, brief:true, period:null, tools:false, toolRange:7 };
  // 固定假数据：30 天（10/08–11/06），Work 与 API 客户端两套来源贡献，展示层合并
  const work = [0.9,1.1,1.2,1.0,1.4,1.3,1.1,1.5,1.2,1.4,1.0,1.6,1.2,1.3,1.5,1.1,1.2,1.4,1.3,1.6,1.1,1.2,1.4,1.1,1.6,1.0,1.35,1.4,1.4,1.55];
  const apiLast = [7,9,8,8.5,9,9.26,11];
  const perDay = work.map((v,index) => { const w=Math.round(v*1e6), a=Math.round((index>=23?apiLast[index-23]:v*7)*1e6); const total=w+a, input=Math.round(total*.88); return {input, output:total-input, work:w, api:a}; });
  const format = value => (value/1e6).toFixed(2)+'M';
  const total = stat => stat.input+stat.output;
  const sum = (count,offset=0) => perDay.slice(30-offset-count,30-offset).reduce((a,b)=>({input:a.input+b.input,output:a.output+b.output}),{input:0,output:0});
  const periodNames = ['今日','近 7 天','近 30 天'];
  function dateLabel(index) { const d = new Date(2026,9,8+index); return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }
  function compare(a,b) {if(a===b)return ['持平',''];if(b===0)return ['新增','kp-up'];const n=(a-b)/b*100;return [`${n<0?'−':'+'}${Math.abs(n).toFixed(1)}%`,n<0?'kp-down':'kp-up'];}
  // hash 参数：确定性截图状态（#shot=default / #shot=expanded）
  const hash = new URLSearchParams(location.hash.replace(/^#/,''));
  if(hash.get('shot')==='expanded'){ui.period=1;ui.tools=true;ui.pinOverlay=24;}
  if(hash.get('scenario')==='incomplete')design.scenario='记录不完整';
  if(hash.get('width')==='300')design.width=300;
  const incomplete = () => design.scenario==='记录不完整';
  function renderQuota() {
    // 冻结区：镜像 v1.4.10 单行布局（标题｜剩余%｜进度条｜重置时间）
    const windows=[['5 小时',77,'11-06 周五 23:40'],['7 天',33,'11-09 周一 00:00'],['月度',58,'11-28 周六 00:00']];
    q('[data-quota-content]').innerHTML=windows.map(w=>`<div class="kp-quota-row"><span class="kp-q-title">${w[0]}</span><span class="kp-q-pct ${w[1]<40?'kp-warn':''}">${w[1]}%</span><div class="kp-track" role="progressbar" aria-label="${w[0]}额度剩余" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${w[1]}"><div class="kp-fill ${w[1]<40?'kp-fill-warn':''}" style="width:${w[1]}%"></div></div><span class="kp-q-reset">${w[2]}</span></div>`).join('');
  }
  function renderPeriods() {
    // 模型展开行与 Codex/现有 App 同构：四列对齐（名称｜总量｜输入｜输出）
    q('[data-period-table]').innerHTML=[1,7,30].map((count,index)=>{const s=sum(count);const first={input:Math.round(s.input*.8),output:Math.round(s.output*.8)};const second={input:s.input-first.input,output:s.output-first.output};return `<button class="kp-period cursor-interaction" data-period="${index}" aria-expanded="${ui.period===index}"><span><span class="kp-chev" aria-hidden="true">›</span>${periodNames[index]}</span><span>${format(total(s))}</span><span>${format(s.input)}</span><span>${format(s.output)}</span></button>${ui.period===index?`<div class="kp-models">${[['K3.1 Pro',first],['K3-256k',second]].map(([name,stat])=>`<div class="kp-model"><span>${name}</span><span>${format(total(stat))}</span><span>${format(stat.input)}</span><span>${format(stat.output)}</span></div>`).join('')}</div>`:''}`;}).join('');
    qa('[data-period]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.period);ui.period=ui.period===index?null:index;renderPeriods();persist();});
  }
  function renderChart() {
    q('[data-chart-first]').textContent=dateLabel(0);
    q('[data-chart-last]').textContent=dateLabel(29);
    const ceiling=Math.max(...perDay.map(total))*1.12;
    q('[data-chart]').innerHTML=perDay.map((stat,index)=>{const missing=incomplete()&&index===27;return `<button class="kp-bar cursor-interaction ${index===29?'kp-today':''} ${missing?'kp-missing':''}" data-day="${index}" aria-label="${dateLabel(index)}，${missing?'无记录':'总量 '+format(total(stat))+'，输入 '+format(stat.input)+'，输出 '+format(stat.output)+' Token'}${index===29?'，今日未结束':''}"><span style="height:${missing?100:Math.max(total(stat)/ceiling*100,2)}%"></span></button>`;}).join('');
    const overlay=q('[data-overlay]');
    const showDay=index=>{const button=qa('[data-day]')[index];if(!button)return;const missing=incomplete()&&index===27;const wrap=q('.kp-chart-wrap').getBoundingClientRect();
      overlay.innerHTML=missing?`${dateLabel(index)} · 无记录<small>该日覆盖未证实，不补 0</small>`:`${dateLabel(index)} · ${format(total(perDay[index]))} Token${index===29?'（今日未结束）':''}<small>输入 ${format(perDay[index].input)} · 输出 ${format(perDay[index].output)}</small>`;
      overlay.hidden=false;
      const ow=overlay.offsetWidth;let left=button.offsetLeft+button.offsetWidth/2-ow/2;left=Math.max(0,Math.min(left,wrap.width-ow));overlay.style.left=left+'px';};
    qa('[data-day]').forEach(button=>{
      button.onmouseenter=()=>showDay(Number(button.dataset.day));button.onfocus=()=>showDay(Number(button.dataset.day));button.onclick=()=>showDay(Number(button.dataset.day));
      button.onmouseleave=()=>{if(ui.pinOverlay==null)overlay.hidden=true;};
    });
    if(ui.pinOverlay!=null){showDay(ui.pinOverlay);}
    const insufficient=incomplete();
    const [dayText,dayCls]=insufficient?['数据不足','']:compare(total(sum(1)),total(sum(1,1)));
    const [weekText,weekCls]=insufficient?['数据不足','']:compare(total(sum(7)),total(sum(7,7)));
    q('[data-compare-day]').textContent=dayText;q('[data-compare-day]').className=dayCls;
    q('[data-compare-week]').textContent=weekText;q('[data-compare-week]').className=weekCls;
    q('[data-compare-day]').closest('.kp-compare-item').title=insufficient?'部分日期覆盖未证实，暂不生成百分比':'（最近1日总量−前1日总量）÷前1日总量';
    q('[data-compare-week]').closest('.kp-compare-item').title=insufficient?'部分日期覆盖未证实，暂不生成百分比':'（最近7日总量−前7日总量）÷前7日总量 · 按数据最新日 D 取 D−6…D 与 D−13…D−7';
  }
  function renderTools() {
    const count=ui.toolRange;
    const s=sum(count);
    const names=['Kimi Work','Kimi CLI','Proma','Claude Code','ZCode','Hermes'];
    const weights=[.52,.18,.12,.09,.05,.04];
    let usedInput=0,usedOutput=0;
    q('[data-tool-detail]').innerHTML=names.map((name,index)=>{const last=index===names.length-1;const input=last?s.input-usedInput:Math.round(s.input*weights[index]);const output=last?s.output-usedOutput:Math.round(s.output*weights[index]);usedInput+=input;usedOutput+=output;const share=(input+output)/Math.max(total(s),1)*100;const state=index===0&&incomplete()?'部分记录 · 缓存':name==='Hermes'?'可读取 · 近似归日':'可读取 · 示例记录';return `<div class="kp-tool" title="${name} · ${state} · 输入 ${format(input)} · 输出 ${format(output)} · 占比 ${share.toFixed(1)}%"><span class="kp-tool-name">${name}</span><span class="kp-share"><div class="kp-track"><div class="kp-fill" style="width:${share.toFixed(1)}%"></div></div><span class="kp-muted">${share.toFixed(0)}%</span></span><span class="kp-tool-total">${format(input+output)}</span></div>`;}).join('');
    q('[data-tool-detail]').hidden=!ui.tools;
    qa('[data-tool-range]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.toolRange)===count)));
  }
  function render(){q('.kp-shell').style.width=design.width+'px';renderQuota();renderPeriods();renderChart();renderTools();
    q('[data-usage-content]').hidden=!ui.usage;q('[data-brief-content]').hidden=!ui.brief;
    q('[data-action="usage"]').setAttribute('aria-expanded',String(ui.usage));
    q('[data-action="brief"]').setAttribute('aria-expanded',String(ui.brief));
    q('[data-action="tools"]').setAttribute('aria-expanded',String(ui.tools));}
  function persist() { if(window.zcode?.setWidgetState) window.zcode.setWidgetState({modelContent:{prototype:'KimiUsage v1.5 proposal v0.6',scenario:design.scenario,width:design.width},privateContent:{ui:{...ui},design:{...design}}}).catch(()=>{}); }
  function restore(snapshot) { const saved=snapshot?.privateContent; if(saved?.ui){const s=saved.ui;ui.usage=s.usage!==false;ui.brief=s.brief!==false;ui.period=[0,1,2].includes(s.period)?s.period:null;ui.tools=s.tools===true;ui.toolRange=[1,7,30].includes(s.toolRange)?s.toolRange:7;}if(saved?.design){if(['正常','记录不完整'].includes(saved.design.scenario))design.scenario=saved.design.scenario;if([300,330].includes(saved.design.width))design.width=saved.design.width;} }
  qa('[data-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.action;
    if(action==='usage'){ui.usage=!ui.usage;render();persist();return;}
    if(action==='brief'){ui.brief=!ui.brief;render();persist();return;}
    if(action==='tools'){ui.tools=!ui.tools;renderTools();q('[data-action="tools"]').setAttribute('aria-expanded',String(ui.tools));persist();return;}
    q('[data-update]').hidden=false;
    if(action==='refresh'){q('[data-last-scan]').textContent='最近尝试刷新（演示）';q('[data-update]').textContent='仅演示刷新，不读取真实记录或访问网络。';}
    else if(action==='quit'){q('[data-update]').textContent='原型不退出应用；正式版保留现有退出动作。';}
    else{q('[data-update]').textContent='版本检查演示：沿用现有更新提示与面板内进度，不发起真实更新。';}});
  qa('[data-tool-range]').forEach(b=>b.onclick=()=>{ui.toolRange=Number(b.dataset.toolRange);renderTools();persist();});
  q('[data-autostart]').onchange=()=>{q('[data-update]').hidden=false;q('[data-update]').textContent='仅演示开关，不修改 LaunchAgent。';};
  restore(window.zcode?.widgetState);render();
  window.addEventListener('zcode:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'scenario',{label:'数据状态',options:['正常','记录不完整']});tweak.addSlider(design,'width',{label:'面板宽度',min:300,max:330,step:30,unit:'pt'});}
})();
</script>
</body></html>
